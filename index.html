<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>PRIME-XR</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;color:#f5f8ff}
body{background:radial-gradient(ellipse at 50% 40%,#17243a 0%,#090f1d 48%,#03050a 100%)}
#stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1100px}
#menu{width:min(82vw,720px);padding:26px;border:1px solid #9bb8d84d;border-radius:28px;background:linear-gradient(145deg,#101a2bdc,#050a14e8);box-shadow:0 25px 90px #000b,inset 0 1px #ffffff20;backdrop-filter:blur(22px);transform:rotateX(2deg);transition:opacity .25s}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:.18em}
.logo span{color:#73d8ff}
.status{font-size:11px;letter-spacing:.14em;color:#91a8c4}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.tile{min-height:118px;border:1px solid #a6c7e63b;border-radius:18px;background:linear-gradient(145deg,#24364e99,#0c1422cc);color:#f4f8ff;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:18px;text-align:left}
.tile:active{transform:scale(.98);border-color:#75dfff}
.glyph{font-size:27px;color:#8be3ff}
.tile strong{font-size:16px;letter-spacing:.04em}
.tile small{font-size:11px;color:#91a8c4}
.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px;color:#8ca2bd;font-size:11px}
#start{border:1px solid #8be3ff88;border-radius:999px;background:#10283b;color:#eafaff;padding:11px 17px;font-weight:700}
#hint{position:fixed;left:14px;right:14px;bottom:14px;text-align:center;color:#9db0c8;font-size:12px;text-shadow:0 1px 8px #000}
@media(max-width:520px){#menu{width:92vw;padding:18px}.tile{min-height:104px;padding:14px}.footer{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="stage">
 <main id="menu" aria-label="Menu principal PRIME-XR">
  <header class="brand"><div class="logo">PRIME<span>-</span>XR</div><div class="status">SPATIAL INTERFACE</div></header>
  <section class="grid">
   <button class="tile" type="button"><span class="glyph">▦</span><strong>JOGOS</strong><small>Biblioteca de experiências</small></button>
   <button class="tile" type="button"><span class="glyph">⚙</span><strong>CONFIGURAÇÕES</strong><small>Preferências do ambiente</small></button>
   <button class="tile" type="button"><span class="glyph">◇</span><strong>LOJA</strong><small>Loja em desenvolvimento</small></button>
  </section>
  <footer class="footer"><span id="mode">MODO 2D · aguardando sessão XR</span><button id="start" type="button">INICIAR VR</button></footer>
 </main>
</div>
<div id="hint">No modo VR compatível, o painel é colocado à sua frente uma única vez e permanece ancorado no espaço.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const start=document.querySelector('#start'),mode=document.querySelector('#mode'),hint=document.querySelector('#hint');
let renderer,scene,camera,menuPlane,session;
async function enterXR(){
 if(!navigator.xr){mode.textContent='WEBXR NÃO DISPONÍVEL NESTE NAVEGADOR';hint.textContent='Abra em um navegador e dispositivo compatíveis com WebXR (HTTPS necessário).';return}
 try{
  const supported=await navigator.xr.isSessionSupported('immersive-vr');
  if(!supported){mode.textContent='DISPOSITIVO SEM SUPORTE A VR IMERSIVO';return}
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.xr.enabled=true;
  renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x050812,1);
  document.body.appendChild(renderer.domElement);
  scene=new THREE.Scene();scene.background=new THREE.Color(0x050812);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,100);
  const light=new THREE.HemisphereLight(0xb9eaff,0x101525,2);scene.add(light);
  const panel=new THREE.Group();
  const bg=new THREE.Mesh(new THREE.PlaneGeometry(1.55,.92),new THREE.MeshBasicMaterial({color:0x0b1424,transparent:true,opacity:.88}));
  panel.add(bg);
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(bg.geometry),new THREE.LineBasicMaterial({color:0x72dfff,transparent:true,opacity:.8}));
  edges.position.z=.006;panel.add(edges);
  const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=720;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#0b1424';ctx.fillRect(0,0,1200,720);
  ctx.fillStyle='#f4f8ff';ctx.font='900 74px Arial';ctx.fillText('PRIME-XR',70,115);
  const labels=[['JOGOS','Experiências'],['CONFIGURAÇÕES','Preferências'],['LOJA','Em desenvolvimento']];
  labels.forEach((a,i)=>{const x=70+(i%2)*550,y=190+Math.floor(i/2)*245;ctx.fillStyle='#1b3048';ctx.fillRect(x,y,500,190);ctx.strokeStyle='#75dfff';ctx.lineWidth=3;ctx.strokeRect(x,y,500,190);ctx.fillStyle='#8be3ff';ctx.font='48px Arial';ctx.fillText(['▦','⚙','◇'][i],x+30,y+65);ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.fillText(a[0],x+30,y+125);ctx.fillStyle='#a8bdd5';ctx.font='23px Arial';ctx.fillText(a[1],x+30,y+162)});
  const tex=new THREE.CanvasTexture(canvas);const face=new THREE.Mesh(new THREE.PlaneGeometry(1.54,.92),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  face.position.z=.012;panel.add(face);
  scene.add(panel);
  session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
  await renderer.xr.setSession(session);
  // Posiciona o painel uma vez à frente do usuário no espaço de referência.
  // Não atualize sua posição com a câmera a cada frame: isso o grudaria na cabeça.
  const reference=await session.requestReferenceSpace('local');
  const pose=session.requestAnimationFrame(function placeOnce(t,frame){
   const viewer=frame.getViewerPose(reference);
   if(viewer){const p=viewer.transform.position,o=viewer.transform.orientation;const q=new THREE.Quaternion(o.x,o.y,o.z,o.w);const forward=new THREE.Vector3(0,0,-1).applyQuaternion(q);panel.position.set(p.x+forward.x*2,p.y+forward.y*2,p.z+forward.z*2);panel.quaternion.copy(q)}
   else session.requestAnimationFrame(placeOnce);
  });
  mode.textContent='VR ATIVO · PAINEL ANCORADO NO ESPAÇO';hint.textContent='Movimente a cabeça: o painel permanece na posição em que foi colocado.';
  renderer.setAnimationLoop(()=>renderer.render(scene,camera));
  session.addEventListener('end',()=>{renderer.setAnimationLoop(null);renderer.domElement.remove();mode.textContent='SESSÃO VR ENCERRADA';});
 }catch(e){mode.textContent='NÃO FOI POSSÍVEL INICIAR VR';hint.textContent=e.message||'Verifique as permissões e a compatibilidade do dispositivo.'}
}
start.addEventListener('click',enterXR);
addEventListener('resize',()=>{if(renderer&&!session){renderer.setSize(innerWidth,innerHeight)}});
</script>
</body>
</html>
